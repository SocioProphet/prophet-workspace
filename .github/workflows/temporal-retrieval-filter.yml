name: Temporal Retrieval Filter

on:
  pull_request:
    paths:
      - 'tools/temporal-retrieval-filter/**'
      - '.github/workflows/temporal-retrieval-filter.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/temporal-retrieval-filter/**'
      - '.github/workflows/temporal-retrieval-filter.yml'

permissions:
  contents: read

jobs:
  # Core teeth: 20 checks (supersession, pass-through, fail-closed rejection, generic-list
  # composition). The regis oracle cross-check self-skips cleanly here (regis not checked out),
  # so the gate is green from the vendored-fixture teeth alone — control that cannot fail.
  filter-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Temporal-retrieval-filter conformance (teeth both ways)
        working-directory: tools/temporal-retrieval-filter
        run: python3 tests/conformance_test.py

  # Consume-not-fork oracle: cross-check this filter's resolve() against regis#20's shipped
  # temporal_retrieve() on the regis fixture. regis-entity-graph is a SIBLING repo, so this
  # checks it out and points REGIS_ENTITY_GRAPH at it (the real module, never a vendored copy).
  # Guarded on ESTATE_CHECKOUT_TOKEN (tracked in #96): green + loud notice until provisioned —
  # the core job above is the merged-in proof.
  oracle-agreement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prophet-workspace
        uses: actions/checkout@v4

      - name: Guard on cross-repo token
        id: guard
        env:
          TOK: ${{ secrets.ESTATE_CHECKOUT_TOKEN }}
        run: |
          if [ -z "$TOK" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::regis oracle cross-check SKIPPED — ESTATE_CHECKOUT_TOKEN not provisioned (see #96); vendored-fixture teeth are the merged-in proof."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout regis-entity-graph (the real temporal_retrieve, consume-not-fork)
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: SocioProphet/regis-entity-graph
          path: _regis
          token: ${{ secrets.ESTATE_CHECKOUT_TOKEN }}

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Oracle cross-check (resolve() == regis#20 temporal_retrieve())
        if: steps.guard.outputs.skip != 'true'
        working-directory: tools/temporal-retrieval-filter
        env:
          REGIS_ENTITY_GRAPH: ${{ github.workspace }}/_regis
        run: python3 tests/conformance_test.py
