name: Knowledge Engineering Workbench

on:
  pull_request:
    paths:
      - 'tools/knowledge-engineering/**'
      - '.github/workflows/knowledge-engineering.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/knowledge-engineering/**'
      - '.github/workflows/knowledge-engineering.yml'

permissions:
  contents: read

jobs:
  validate-knowledge-engineering:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate KE workspace contract (teeth both ways)
        run: python3 tools/knowledge-engineering/validate_ke_workspace.py

      - name: Install spine dep (blake3 — advisory non-FIPS dual-hash; the KE receipt test imports proof_artifact)
        run: python3 -m pip install -r tools/proof-artifact-spine/requirements.txt

      - name: KE conformance suite (per-tooth + receipt spine)
        run: python3 tools/knowledge-engineering/tests/ke_test.py
