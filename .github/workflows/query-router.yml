name: Query Router

on:
  pull_request:
    paths:
      - 'tools/query-router/**'
      - 'tools/cypher-atomspace-gateway/**'
      - 'tools/proof-artifact-spine/**'
      - 'tools/text-to-sql/**'
      - 'tools/self-query/**'
      - '.github/workflows/query-router.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/query-router/**'
      - 'tools/cypher-atomspace-gateway/**'
      - 'tools/proof-artifact-spine/**'
      - 'tools/text-to-sql/**'
      - 'tools/self-query/**'
      - '.github/workflows/query-router.yml'

permissions:
  contents: read

jobs:
  router-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install spine advisory dep
        run: python3 -m pip install blake3  # proof-artifact-spine imports blake3 (advisory, non-FIPS)

      # The router CONSUMES the sibling WO-A gateway parser and WO-B spine ledger, so this
      # suite also guards those seams (the paths above re-trigger it if either dependency changes).
      # Gating it means the WO-A2 routing contract cannot silently rot — control that cannot fail.
      - name: Query-router conformance (logical + semantic route, fallback, #602 pin, teeth both ways)
        working-directory: tools/query-router
        run: python3 tests/conformance_test.py

  # Gates the WIRED graph→vector selective route (#81). It consumes the REAL agentplane fibered
  # descend-abstain gate (fiber_retrieval) — but as a SHA-256-pinned VENDORED copy under
  # tools/query-router/vendor/agentplane (consume-not-fork: a byte-identical snapshot at a recorded
  # commit, kept honest by the consume-guard). So the full teeth run WITHOUT a cross-repo checkout and
  # WITHOUT ESTATE_CHECKOUT_TOKEN — the token requirement of #96 is retired (live-binding + sherlock-
  # scout wiring remain tracked there). The consume-guard runs FIRST as a gate: if the
  # vendored copy ever drifts from its recorded digest, this job fails closed before the teeth run.
  selective-route-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prophet-workspace
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # GATE: the vendored agentplane copy must match its SHA-256 pin in vendor/VENDOR.md (source-os#317
      # drift guard). Runs before the teeth so silent drift of the consumed gate is caught first.
      - name: Vendor consume-guard (SHA-256 drift gate on vendor/agentplane)
        working-directory: tools/query-router
        run: python3 tests/vendor_consume_guard.py

      - name: Install spine advisory dep
        run: python3 -m pip install blake3  # proof-artifact-spine imports blake3 (advisory, non-FIPS)

      - name: Selective route conformance (graph→vector fuse, descend-abstain gate, teeth both ways)
        working-directory: tools/query-router
        run: python3 tests/selective_route_conformance.py
