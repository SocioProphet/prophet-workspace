# WO-I docs drift control — enforce the docs-as-code standard on every change to docs/ or the checker.
name: docs-lint
on:
  pull_request:
    # tools/** included so a new tools/<module> triggers the coverage check (else it goes silently red)
    paths: ["docs/**", "tools/**", ".github/workflows/docs-lint.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "tools/**"]
permissions:
  contents: read
jobs:
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Docs lint self-test (teeth)
        run: python3 tools/tests/validate_docs_test.py
      - name: Docs drift control (metadata + links + coverage)
        run: python3 tools/validate_docs.py
